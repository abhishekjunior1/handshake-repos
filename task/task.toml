artifacts = ["/app/output.json"]

[task]
name = "dynamo/task-runner"
description = "Debug a multi-stage task execution pipeline with dependency resolution, parallel execution, and retry support."

[metadata]
category = "software_engineering"
subcategory = "scripting_and_automation"
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
task_objective = ["fix", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 5.0
difficulty_explanation = "The task runner spans 6 modules (~1000 lines) implementing a realistic CI/CD pipeline executor. Three bugs are distributed across resolver.py, executor.py, and runner.py. Each bug involves subtle behavioral semantics: priority scheduling that should account for critical path depth (not just base priority), retry state management that should preserve captured environment exports across command failures, and parallel result collection ordering that must be deterministic. The bugs compound—incorrect priority ordering leads to suboptimal scheduling, lost exports cause downstream command failures, and non-deterministic result ordering produces inconsistent output. The visible taskfile uses sequential execution (parallelism=1), no retry-with-export combinations, and unique priorities per level, making all bugs invisible. Only the hidden taskfile with deep dependency chains, retry-dependent export capture, and parallel execution groups with different completion times triggers all three simultaneously. A build systems engineer familiar with DAG scheduling semantics, stateful retry conventions, and deterministic pipeline output requirements would identify these issues."
solution_explanation = "Three patches: (1) resolver.py _get_effective_priority() adds depth*10 boost to base priority—tasks deeper in the dependency graph (on the critical path) should be scheduled earlier within their execution level to minimize pipeline latency. (2) executor.py _execute_with_retry() removes the 'env = self._build_env(task)' line that rebuilds environment on retry—this destroys captured exports from prior successful commands, causing downstream commands to fail when they reference exported variables. (3) runner.py _execute_group() replaces as_completed iteration with submission-order iteration—collects (task_name, future) pairs in a list and iterates them in order, ensuring tasks_executed reflects the deterministic scheduling order rather than non-deterministic completion times."
verification_explanation = "The test copies task/tests/hidden_taskfile.json to /app/taskfile.json and runs the pipeline. The hidden taskfile has: (1) parallelism=3 triggering the parallel execution path with build tasks that have different sleep durations (0.3s, 0.15s, 0.05s) causing as_completed to return them in reverse order; (2) setup-env task with retries=2 that exports ARTIFACT_TAG in command 1, deliberately fails command 2 on first attempt (test -f .attempt trick), then needs ARTIFACT_TAG in command 3—rebuilding env on retry loses the export; (3) tasks at the same execution level with priorities that only produce correct ordering when depth-boosted. The expected output at task/tests/expected_output.json verifies success=true, correct tasks_executed order, and all task results showing status=success."

