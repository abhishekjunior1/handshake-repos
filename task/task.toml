artifacts = ["/app/output.json"]

[task]
name = "dynamo/task-runner"
description = "Debug a multi-stage task execution pipeline with dependency resolution, parallel execution, and retry support."

[metadata]
category = "software_engineering"
subcategory = "scripting_and_automation"
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
task_objective = ["fix", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 5.0
difficulty_explanation = "The task runner spans 6 modules (~1100 lines) implementing a realistic CI/CD pipeline executor. Three bugs are distributed across executor.py and runner.py, with two decoy patterns (correct-but-suspicious code) that agents must leave untouched. Bug 1: two-pass variable expansion where the second pass must search the partially-expanded result rather than the original template. Bug 2: the runner calls get_scheduled_groups() (priority ordering) instead of get_parallelizable_groups() (alphabetical ordering)—agents must choose between two similar resolver functions where the priority-based one sounds more correct but produces wrong task order. Bug 3: retry state management rebuilds the environment, losing captured exports. The decoys compound difficulty: a post-collection alphabetical sort in _run_parallel looks redundant but is essential for deterministic output, and a _sanitize_captured_value helper looks like data corruption but handles shell control characters. Visible taskfile uses parallelism=1 with no chained vars and no retries, making all bugs invisible. Data is synthetic, shaped like real CI/CD pipeline configurations. A build systems engineer familiar with DAG scheduling semantics and template expansion would identify these issues."
solution_explanation = "Three patches in two files: (1) executor.py _expand_variables() changes the second-pass regex iteration from searching 'command' (the original template) to searching 'result' (the partially-expanded string after ${VAR} processing)—this enables chained expansion where $VAR references introduced by ${VAR} substitution are correctly resolved. (2) runner.py _run_parallel() replaces resolver.get_scheduled_groups() with resolver.get_parallelizable_groups()—the scheduled variant orders tasks by priority within each level, but the pipeline requires alphabetical ordering for deterministic output matching the post-collection sort. (3) executor.py _execute_with_retry() removes the 'env = self._build_env(task)' line that rebuilds environment on retry—this preserves captured stdout exports from prior successful commands. The post-collection sort and _sanitize_captured_value helper are correct behaviors that must be preserved."
verification_explanation = "The test copies task/tests/hidden_taskfile.json to /app/taskfile.json and runs the pipeline. The hidden taskfile has: (1) parallelism=3 triggering the parallel execution path with build tasks having different priorities and execution times—get_scheduled_groups returns them in priority order (build-worker, build-gateway, build-api by priority 15,10,5) while get_parallelizable_groups returns alphabetical (build-api, build-gateway, build-worker) matching expected output; (2) setup-env task with retries=2 whose command 1 exports ARTIFACT_TAG=release-3.2.1, command 2 deliberately fails on first attempt, and command 3 uses ${DEPLOY_TEMPLATE} which contains embedded $ARTIFACT_TAG requiring both preserved exports and chained expansion; (3) DEPLOY_TEMPLATE env var set to 'artifact=$VERSION tag=$ARTIFACT_TAG' where $VERSION resolves from task env but $ARTIFACT_TAG only appears after ${DEPLOY_TEMPLATE} expansion. The expected output verifies success=true, correct alphabetical tasks_executed order, and all task results showing status=success."

