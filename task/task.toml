artifacts = ["/app/output_eval.json"]

[task]
name = "dynamo/task-runner"
description = "Debug a multi-stage task execution pipeline with dependency resolution, parallel execution, and retry support."

[metadata]
category = "software_engineering"
subcategory = "scripting_and_automation"
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
task_objective = ["fix", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 5.0
difficulty_explanation = "The task runner spans 6 modules (~1000 lines) implementing a realistic CI/CD pipeline executor. Three bugs are distributed across executor.py and runner.py. Each bug involves subtle behavioral semantics: two-pass variable expansion where the second pass must search the partially-expanded result rather than the original template to support chained references, retry state management that must preserve environment exports captured from prior successful commands, and parallel result collection that must use deterministic submission order rather than non-deterministic completion order. The bugs compound—incorrect variable expansion prevents proper template rendering when env values contain embedded variable references, lost exports on retry cause downstream commands to receive unexpanded placeholders, and non-deterministic parallel ordering produces inconsistent tasks_executed lists. The visible taskfile uses sequential execution (parallelism=1) with no chained variable expansions and no retry-with-export combinations, making all bugs invisible during normal testing. Only the hidden taskfile with parallelism=3, chained DEPLOY_TEMPLATE expansion referencing a runtime-captured ARTIFACT_TAG, and build tasks with different execution times triggers all three simultaneously. A build systems engineer familiar with template expansion semantics, stateful retry conventions, and deterministic pipeline output requirements would identify these issues."
solution_explanation = "Three patches in two files: (1) executor.py _expand_variables() changes the second-pass regex iteration from searching 'command' (the original template) to searching 'result' (the partially-expanded string after ${VAR} processing)—this enables chained expansion where $VAR references introduced by ${VAR} substitution are correctly resolved. (2) executor.py _execute_with_retry() removes the 'env = self._build_env(task)' line that rebuilds environment on retry—this preserves captured stdout exports from prior successful commands so that downstream commands can reference exported variables like ARTIFACT_TAG. (3) runner.py _execute_group() replaces as_completed iteration with submission-order iteration—stores (task_name, future) pairs in a list and iterates them in declaration order, ensuring tasks_executed reflects the deterministic alphabetical scheduling order from get_parallelizable_groups() rather than non-deterministic completion times."
verification_explanation = "The agent is instructed to run `python3 /app/runner.py /app/eval_taskfile.json /app/output_eval.json` during its phase. The verifier reads the agent-produced `/app/output_eval.json` and runs per-field assertions via pytest: success flag is true, tasks_executed contains all 9 tasks in the correct alphabetical order for parallel groups (build-api before build-gateway before build-worker), setup-env has status success with retry evidence (>=4 commands with first attempt failing), the build_vars.sh command contains the resolved 'release-3.2.1' value (not an unexpanded variable reference), and each build task has status success. The nondeterministic duration_ms and timings fields are not asserted."

