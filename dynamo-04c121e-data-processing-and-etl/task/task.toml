artifacts = ["/app/output.json"]

[task]
name = "dynamo/nconf-parser"
description = "Fix bugs in a NestedConf file format parser/serializer pipeline that handles cross-references and escape sequences."

[metadata]
category = "Data Processing and ETL"
subcategory = "File format parsing and serialization"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["fix", "transform"]
artifact_type = ["codebase", "text_or_log_file"]
expert_time_estimate_hours = 5.0
difficulty_explanation = "The pipeline spans 6 modules (~550 lines) implementing a custom configuration format parser without external libraries. Three bugs are cross-module data-flow issues rather than formula errors or code smells: (1) the orchestrator selects a non-recursive resolution mode causing chained references to resolve incompletely, (2) escape sequence processing uses an ordering that causes backslash-letter pairs in paths to be misinterpreted as control characters, and (3) the serializer receives normalized (lowercase) section names when it should receive original-cased names. Each module is individually correct in isolation — the bugs emerge from how the orchestrator passes parameters between modules. Visible data uses a single lowercase section with no cross-references or escape sequences, making all three bugs mathematically invisible. A configuration management engineer or language tooling developer would encounter this pattern when building format parsers for deployment systems. Data is synthetic, shaped like enterprise multi-environment configuration files."
solution_explanation = "The solver applies three targeted patches: (1) changes the resolver mode parameter from 'shallow' to 'full' in pipeline.py to enable recursive resolution of chained references, (2) reorders escape sequence processing in parser.py to handle literal-backslash (\\\\) before single-character escapes (\\n, \\t) using a placeholder strategy, and (3) changes the section_names list comprehension in pipeline.py from s.name (normalized lowercase) to s.original_name (case-preserved). Each fix is 1-3 lines. The key insight is recognizing that all bugs are in how the pipeline orchestrator configures and feeds data to correct modules — not in the modules themselves."
verification_explanation = "The verifier substitutes a hidden multi-section configuration file containing mixed-case section names (Environment, DatabaseSettings, Paths, AppConfig, Logging), chained variable references (AppConfig references Paths which references Environment), and Windows-style paths with backslash escapes (C:\\Users\\admin\\temp). The expected output is computed by the fixed pipeline and compared via exact JSON equality. Bug 1 causes chained references to appear as unresolved ${...} literals (100% wrong). Bug 2 causes \\t in paths to become tab characters (corrupted string). Bug 3 causes all section names and output keys to be lowercase instead of preserving original casing. All three bugs must be fixed simultaneously for the output to match — partial fixes still fail multiple test assertions."

