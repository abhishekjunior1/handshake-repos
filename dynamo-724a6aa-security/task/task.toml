artifacts = ["/app/output.json"]

[task]
name = "dynamo/threat-correlator"
description = "Security event correlation engine with deduplication and threat scoring bugs."

[metadata]
category = "Security"
subcategory = "Authentication and authorization"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["fix", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 5.0
difficulty_explanation = "7 modules totaling ~1200 lines of code with 2 cross-module data-flow bugs in the pipeline orchestrator that pass incorrect functions/parameters to otherwise correct downstream modules. Bugs are justified by plausible comments framing them as intentional design choices. Two decoy patterns (IPv4-mapped normalization and geometric mean aggregation) appear suspicious but are correct — modifying them breaks output by 15-40%. Visible test data masks both bugs because events have unique semantic fields (dedup is no-op) and fall within a 60-second window (decay factor ≈ 1.0). Data is synthetic, crafted to isolate the dedup/decay divergence while remaining representative of real enterprise SIEM feeds (mixed event types, varied severities, realistic IP distributions). A security analyst with SIEM experience would need to trace cross-module data flow and reason about when dedup/decay semantics diverge."
solution_explanation = "Replace compute_full_hash with compute_semantic_hash in the deduplicate_events call (line uses full fingerprint including timestamp, preventing dedup of repeated attacks). Replace compute_raw_score(source_events) with compute_decayed_score(source_events, config['reference_time'], DECAY_HALF_LIFE) in the scoring section (raw score ignores event age, treating stale events equally)."
verification_explanation = "Hidden test data contains repeated attacks (same src_ip, dest_ip, rule_id, payload_signature at different timestamps) that should be deduplicated by semantic hash but are retained by full hash. Events are spread over 2 hours with reference_time 1 hour after earliest, making decay significant. IPv4-mapped IPv6 addresses test that normalization is preserved. Expected output is generated by the fixed pipeline on hidden data."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
