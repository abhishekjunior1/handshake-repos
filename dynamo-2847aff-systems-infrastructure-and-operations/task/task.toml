[task]
name = "dynamo/firewall-policy-eval"
description = "Debug a zone-based firewall policy evaluation engine with NAT translation, stateful tracking, and zone-pair resolution bugs."

[metadata]
category = "Systems Infrastructure and Operations"
subcategory = "Network configuration"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["fix", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 4.0
difficulty_explanation = "A 900-line multi-module zone-based firewall policy evaluator has three orchestration bugs in how the pipeline sequences NAT translation relative to rule evaluation, how it constructs connection state lookup keys, and how it builds zone-pair policy identifiers. Each module (zone_parser, rule_engine, nat_translator, policy_resolver, flow_tracker) is individually correct — bugs exist only in the orchestrator's calls to those modules. The visible configuration uses identity NAT mappings and alphabetically-ordered zone names that make all three bugs produce mathematically identical output to the correct implementation. Hidden test data uses real DNAT translations, directionally-asymmetric zone names, and return traffic that exercise all bugs simultaneously. The task requires understanding firewall processing order conventions (DNAT before policy evaluation per zone-based firewall architecture), stateful connection tracking tuple semantics (post-translation keying), and directional zone-pair policy resolution — domain knowledge that network security engineers apply daily but that is not derivable from code inspection alone. Data is synthetic, shaped like a production multi-zone enterprise network configuration. A senior network security engineer debugging policy mismatches would do this work."
solution_explanation = "The solver patches three locations in pipeline.py: (1) moves the nat_translator.apply_dnat() call before the resolve_policy() and evaluate_rules() calls so that destination-based rules see the post-NAT IP address; (2) changes the state table lookup key from the original pre-NAT packet tuple to the post-DNAT translated tuple so that return traffic matches established connections correctly; (3) changes build_zone_pair_key() from tuple(sorted([src_zone, dst_zone])) to (src_zone, dst_zone) preserving directional semantics. Each fix is 1-3 lines. The key insight is that all three bugs produce identical results on the visible configuration due to identity NAT and alphabetical zone ordering, but diverge catastrophically on configurations with real NAT translations and non-alphabetical zone names."
verification_explanation = "The verifier substitutes a hidden network configuration (hidden_network_config.json) containing 4 zones with non-alphabetical directional relationships, real DNAT rules (203.0.113.50→10.0.2.80), and 8 packets including return traffic. The fixed pipeline must produce exact JSON match against expected_output.json on all fields: per-packet action (permit/deny), NAT application flags, connection state (new/established), matched rule names, and summary counts (7 permitted, 1 denied, 2 NAT translations, 2 stateful matches). The buggy pipeline produces 1 permitted vs 7, making the deviation unambiguous. All three bugs must be fixed simultaneously — fixing any subset still fails because DNAT ordering affects state storage which affects return traffic matching."

