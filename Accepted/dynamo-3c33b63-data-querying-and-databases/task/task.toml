[task]
name = "dynamo/analytical-query-engine"
description = "Debug an analytical query engine that executes GROUP BY aggregations, window functions, and multi-table JOINs against JSON-based tabular data."

[metadata]
category = "Data Querying and Databases"
subcategory = "Analytical queries"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["fix", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 5.0
difficulty_explanation = "The pipeline spans 7 modules (~1000 lines) implementing an analytical query execution engine without external libraries. Three bugs produce silently incorrect results that require understanding SQL semantics and data properties — not code inspection. Bug 1 is a fan-out (double-dipping) aggregate: joining a one-to-many table before aggregating inflates COUNT and SUM values, but this is invisible when every parent has exactly one child row. Bug 2 is an implicit RANGE frame default: when ORDER BY has ties, the SQL-standard RANGE UNBOUNDED PRECEDING includes all peer rows in the running total, but this matches ROWS behavior when all values are unique. Bug 3 is an ON-WHERE contradiction: applying a filter as WHERE after a LEFT JOIN silently converts it to an inner join by discarding outer rows, but this is invisible when all left-side rows have matching right-side rows. Each bug runs without errors and produces plausible-looking results — detection requires independently computing the mathematically correct answer. The visible data has 1 line per order, unique ordering values, and all rows matching in joins. A database engineer or query optimizer specialist would encounter these patterns in production analytics workloads. Data is synthetic, shaped like an e-commerce order processing system."
solution_explanation = "Fix Bug 1 in pipeline.py _execute_join_aggregate_query: when all aggregation columns come from the left table, aggregate directly on the source table instead of the joined result to avoid fan-out inflation from one-to-many joins. Fix Bug 2 in window_functions.py: change the default frame_mode from 'range' to 'rows' so running totals accumulate sequentially rather than including all peer rows. Fix Bug 3 in pipeline.py _execute_join_aggregate_query: apply the join filter to the right table BEFORE the LEFT JOIN (ON semantics) rather than after (WHERE semantics) so outer rows are preserved for customers without matching orders."
verification_explanation = "The verifier substitutes hidden_queries.json containing: orders with 1-3 line items per order triggering fan-out inflation (Bug 1 makes customer 10 show count=6 instead of 3, freight=215 instead of 95), orders sharing the same date triggering RANGE peer inclusion (Bug 2 makes running total jump to 75 instead of sequential 45 then 75), and customers without shipped orders triggering outer row loss (Bug 3 drops customers 40 and 60 entirely, returning 4 rows instead of 6). Tests check exact JSON equality on row counts, aggregate values, and cumulative totals — no tolerance needed since all values are integers or exact decimals."

