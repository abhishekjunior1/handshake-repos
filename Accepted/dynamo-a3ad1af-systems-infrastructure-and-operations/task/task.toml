artifacts = ["/app/output.json"]

[task]
name = "dynamo/netconfig-audit"
description = "Network configuration validation and routing pipeline with OSPF cost computation and ACL evaluation bugs."

[metadata]
category = "Systems Infrastructure and Operations"
subcategory = "Network configuration"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["fix", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 5.0
difficulty_explanation = "The pipeline spans 7 files (~1200 lines) implementing OSPF routing, ACL evaluation, and misconfiguration detection without external libraries. Two bugs reside in the orchestrator (pipeline.py) where values passed to correct modules are derived incorrectly: (1) OSPF cost uses interface bandwidth instead of link bandwidth — invisible on point-to-point topologies where both are equal, triggers on aggregated/tunneled links; (2) ACL interface_scope resolution uses the destination subnet instead of the flow's host address — invisible with /32 host routes, triggers with /24 subnets causing broader deny matches. The integer OSPF cost convention and administrative distance tie-breaking are correct decoy patterns. Data is synthetic, shaped like enterprise campus networks. A network engineer designing routing policy and firewall rules would do this work."
solution_explanation = "Fix 1: In _compute_all_ospf_costs, replace iface['bandwidth'] with link['bandwidth'] so OSPF cost derives from the link's actual capacity rather than the interface's local bandwidth setting. Fix 2: In _evaluate_flows, replace dest_subnet['network'] with flows[0]['destination_ip'] and dest_subnet['prefix_length'] with 32 so interface_scope rules match the exact host address rather than the receiving interface's entire subnet. Both fixes are single-line replacements in pipeline.py; all other modules remain unchanged."
verification_explanation = "The verifier substitutes a hidden topology (4 routers with aggregated/tunneled links where link_bw != iface_bw, and /24 LAN subnets) and hidden config (5 flows including one that is incorrectly denied by the /24 scope bug). It runs the fixed pipeline and compares output.json against expected values: OSPF costs must be exactly 2, 10, 5, 20 (not 100); ACL must permit 4 flows (not 3); routing metrics must reflect correct costs. Exact JSON match on ospf_link_costs, flow decisions, and route metrics ensures both bugs are fixed simultaneously."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 3600.0

