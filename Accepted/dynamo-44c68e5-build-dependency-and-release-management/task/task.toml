artifacts = ["/app/output.json"]

[task]
name = "dynamo/nix-store-paths"
description = "Debug a Nix-style derivation hashing pipeline that incorrectly computes store paths for fixed-output derivations, misvalidates compressed cache entries, and mishandles self-referencing outputs."

[metadata]
category = "Build Dependency and Release Management"
subcategory = "Build system configuration"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["fix", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 5.0
difficulty_explanation = "The pipeline spans 8 files (~520 lines) implementing Nix-style content-addressed store path computation without external libraries. Three bugs are spread across 3 files — pipeline.py, cache_validator.py, and store_path_calculator.py. Bug 1 (pipeline.py) treats all derivations uniformly as input-addressed when fixed-output derivations should use make_fixed_output_path which computes a two-level fingerprint from the declared output hash. Bug 2 (cache_validator.py) uses FileHash for compressed entries instead of always using NARHash — the logic looks correct (prefer transfer-level hash for compressed) but NARHash is the canonical content hash regardless of compression. Bug 3 (store_path_calculator.py) appends the placeholder as an additional reference instead of replacing self-references with it — the comment says 'sentinel for distinct hash space' which sounds correct but creates wrong hashes. All bugs are invisible on visible data (no fixed-output derivations, no compressed cache entries, no self-references). The pipeline also contains correct-but-suspicious Nix internals (reversed base32, ! separator notation) that agents over-fix. A Nix/NixOS package maintainer familiar with store internals would debug this. Data is synthetic, shaped like a real Nix build graph."
solution_explanation = "Fix 1 (pipeline.py): Add conditional check for is_fixed_output flag — when true, use make_fixed_output_path(hash_algo, output_hash, name) instead of hash_derivation_inputs. Fixed-output derivations compute paths from declared content hash only. Fix 2 (cache_validator.py): Change _extract_integrity_hash to always return NARHash regardless of compression — NARHash is the canonical content hash of the uncompressed NAR stream. Fix 3 (store_path_calculator.py): Change compute_path_hash_with_placeholder to replace self-references with placeholder in the references list (masked_refs) instead of appending placeholder as an additional entry."
verification_explanation = "The verifier substitutes hidden config with 8 derivations: 2 fixed-output, 5 input-addressed (3 depending on fixed-output), and 1 self-referencing. Cache uses xz compression (FileHash != NARHash). Bug 1 causes 7/8 wrong store paths (fixed-output hashes cascade to dependents). Bug 2 causes valid compressed cache entries to be rejected (FileHash != expected NARHash). Bug 3 causes the self-referencing derivation to get wrong path. Combined: buggy produces 0 substitutes vs correct 1-3 substitutes with different store paths. All fields checked with exact equality."

