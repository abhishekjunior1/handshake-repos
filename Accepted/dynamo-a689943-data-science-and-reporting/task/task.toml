artifacts = ["/app/output.json"]

[task]
name = "dynamo/spectral-anomaly"
description = "Fix bugs in a spectral anomaly detection pipeline that uses frequency-domain methods on non-stationary time series."

[metadata]
category = "Data Science and Reporting"
subcategory = "Time-series analysis"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["fix", "analyze"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 5.0
difficulty_explanation = "The pipeline spans 6 modules (~1160 lines) implementing spectral anomaly detection without external libraries. Two bugs are cross-module data-flow issues in the orchestrator: (1) the pipeline passes the full series length as the effective sample size to the scorer, instead of the window-adjusted effective sample size computed by the spectral estimator — with rectangular windows the two are identical, but with tapered windows the scores are scaled incorrectly; (2) the pipeline computes a single global anomaly threshold across all segments instead of per-segment local thresholds — with single-segment stationary data the global equals local, but with multi-segment non-stationary data the threshold is miscalibrated for each regime. Two decoy patterns (temporal decay weighting and angular frequency density normalization by 2*pi) look suspicious but are correct — removing either produces substantially different output. A signal processing engineer or time-series analyst working on monitoring systems would do this work. Data is synthetic, shaped like industrial sensor telemetry with variance regime shifts."
solution_explanation = "The solver applies two targeted patches to pipeline.py: (1) changes n_effective=n to n_effective=spectral['n_effective'] in the anomaly scoring call, using the window-adjusted effective sample size that the spectral estimator already computes; (2) replaces the global threshold computation and application with per-segment local thresholds computed from each segment's score distribution. Each fix is 1-3 lines. The key insight is recognizing that both bugs are in how the orchestrator passes values to correct modules — the modules themselves are individually correct."
verification_explanation = "The verifier substitutes a hidden configuration with a Hann window (n_effective != n) and non-stationary series producing 6 segments with different variance levels. The expected output is computed by the fixed pipeline and compared via exact JSON equality. Bug 1 causes scores to be scaled by n_residuals/120 instead of n_residuals/n_eff (~13x difference), leading to 3 false positive anomalies. Bug 2 applies a single low global threshold (0.028) instead of segment-appropriate local thresholds (0.04-0.35), further contributing to false detections. Both bugs must be fixed simultaneously for the output to match."

[verifier]
timeout_sec = 120.0

