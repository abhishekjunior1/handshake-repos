artifacts = ["/app/pebble"]

[task]
name = "dynamo/pebble-fix"
description = "Fix multiple bugs in a Pebble interpreter affecting boolean output and loop scoping semantics."

[metadata]
category = "software_engineering"
subcategory = "compilers_interpreters_and_programming_languages"
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
task_objective = ["fix"]
artifact_type = ["single_script_or_program"]
expert_time_estimate_hours = 0.5
difficulty_explanation = "The interpreter has a visible bug (boolean printing) but its closure capture logic is correct for Pebble's semantics: fn captures only the immediately enclosing scope by value. Agents with PL training will likely 'fix' the capture to deep-copy the entire environment chain, believing shallow copy is a bug. This over-correction produces wrong values on held-out programs that depend on the shared-parent-cell semantics of Pebble's design. The 7 synthetic test programs are hand-authored to expose both the real bug and the over-correction trap. PL engineers maintaining production interpreters face this pattern when shallow capture is intentional."
solution_explanation = "Two bugs must be fixed: (1) boolean printing uses Python's str() which outputs 'True'/'False' instead of 'true'/'false' — fix with str(v).lower() for booleans; (2) the for-loop reuses a single scope across iterations instead of creating a fresh environment per iteration — fix by allocating a new Env and Cell for the loop variable on each iteration. The fn/&fn capture logic is correct and must not be altered."
verification_explanation = "The verifier runs the interpreter on 5 visible programs plus 3 hidden programs (06_shared_parent tests that fn closures share their parent scope's mutations, 07_bool_in_expr tests boolean values in expressions, 08_for_closure tests that for-loop closures capture independent per-iteration values). All 8 must produce exactly the expected stdout."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
