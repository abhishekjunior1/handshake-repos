artifacts = ["/app/output.json"]

[task]
name = "dynamo/eda-pipeline"
description = "Fix bugs in an exploratory data analysis pipeline that handles missing values, outliers, and group aggregations."

[metadata]
category = "Data Science and Reporting"
subcategory = "Exploratory data analysis"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["fix", "analyze"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 5.0
difficulty_explanation = "The pipeline spans 6 modules (~550 lines) implementing exploratory data analysis without external libraries. Three bugs are cross-module issues: (1) the orchestrator runs outlier detection before missing value imputation, causing IQR bounds to be computed with NaN-corrupted quartiles — with complete data (no NaN) imputation is a no-op so order is irrelevant; (2) the orchestrator passes raw columns to the correlation computation instead of outlier-cleaned columns — with no outliers present, raw equals cleaned; (3) the statistics module computes group means using total_count (including NaN) as denominator instead of valid_count — with complete data, total equals valid. Two decoy patterns look suspicious: Spearman uses rank-based computation (looks redundant alongside Pearson but is intentional for robustness) and kurtosis subtracts 3 (excess kurtosis, standard Fisher convention). A data analyst or statistician building automated EDA tools would do this work. Data is synthetic, shaped like corporate survey data with missing responses and data entry errors."
solution_explanation = "The solver applies three patches: (1) reorders pipeline.py to impute missing values before outlier detection so IQR bounds are computed on complete data; (2) changes pipeline.py to pass cleaned_columns instead of raw_columns to compute_correlation_matrix; (3) changes statistics.py group mean computation to only increment the count when the value is not None (valid_count denominator). Each fix is 1-3 lines. The key insight is that all three bugs are invisible on complete data without outliers — they only manifest when NaN values corrupt quartiles, when outliers dominate correlations, or when group-level NaN rates vary."
verification_explanation = "The verifier substitutes a hidden dataset with 10% missing values, 3 extreme outliers (100x normal range), and groups with varying NaN rates. Expected output is computed by the fixed pipeline and compared via exact JSON equality. Bug 1 produces wrong IQR bounds (NaN-corrupted quartiles detect different outliers). Bug 2 produces wrong Pearson correlations (extreme outliers at 100x dominate the correlation structure). Bug 3 produces deflated group means (NaN in denominator reduces computed averages). All three bugs must be fixed simultaneously."

[verifier]
timeout_sec = 120.0

