artifacts = ["/app/output.json"]

[task]
name = "dynamo/metrics-aggregation"
description = "Debug a metrics aggregation pipeline that computes rates, percentiles, and rollups from counter, gauge, and histogram time-series data."

[metadata]
category = "Systems Infrastructure and Operations"
subcategory = "Logging monitoring and observability"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["fix", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 5.0
difficulty_explanation = "The pipeline spans 8 modules (~1400 lines) implementing Prometheus-style metrics aggregation without external libraries. Three bugs in the orchestrator pass plausible-but-wrong values to correct module functions: (1) rate computation normalizes each delta over the total series time span instead of the per-sample interval — justified as 'smoothed rate estimation', (2) histogram merging accumulates all historical snapshots instead of using only the latest cumulative snapshot per source — justified as 'comprehensive percentile estimation', (3) stale-marker detection uses an adaptive threshold (collection_interval × 5 = 75s) instead of the standard fixed threshold (STALENESS_THRESHOLD_SEC = 300s) — justified as 'adaptive monitoring'. All bugs are invisible on the visible data due to mathematical degeneracy: 2 datapoints make total_span equal per-sample interval, single source has one histogram snapshot, and no gaps exceed 75s. Two correct-but-suspicious patterns (cross-source timestamp sort, partial-bucket extrapolation) serve as decoys. Data is synthetic, shaped like production Prometheus scrape exports. An SRE or observability platform engineer would do this work."
solution_explanation = "Fix 1: Replace 'total_span = sorted_dps[-1][\"timestamp\"] - sorted_dps[0][\"timestamp\"]' with per-delta 'time_delta = delta_record[\"timestamp\"] - delta_record[\"prev_timestamp\"]' and use that as the rate divisor. Fix 2: Instead of calling aggregate_histograms_by_name() which collects all datapoints, restructure to take only the latest datapoint per source then merge those. Fix 3: Replace the inline staleness detection (using collection_interval * 5) with a call to the module's detect_stale_series() which uses the correct 300-second threshold."
verification_explanation = "Hidden data has varying scrape intervals (10-30s vs 2 datapoints at 15s), multiple histogram sources with 2 snapshots each, and gauge gaps of 155-165 seconds (between 75s bug threshold and 300s correct threshold). Bug 1 causes 66-75% rate deviation because total_span=90s across 5 points vs per-sample intervals of 10-30s. Bug 2 causes 22-100% histogram deviation from double-counting cumulative observations. Bug 3 causes incorrect stale_markers_inserted count (1 instead of 0) for gauges with 155-165s gaps. All comparisons at 1e-4 relative tolerance."

