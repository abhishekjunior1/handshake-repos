artifacts = ["/app/output.json"]

[task]
name = "dynamo/hierarchical-bayes"
description = "Bayesian hierarchical model fitting pipeline with empirical Bayes shrinkage and model comparison bugs."

[metadata]
category = "Scientific Computing and Domain Science"
subcategory = "Statistical Modeling"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["fix", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 5.0
difficulty_explanation = "The pipeline spans 7 files (~750 lines) implementing hierarchical Bayesian estimation with James-Stein shrinkage, t-distribution credible intervals, and DIC/WAIC model comparison without external libraries. Two bugs reside in the orchestrator (pipeline.py) where values passed to correct modules are derived incorrectly: (1) shrinkage computation receives within-group variance where between-group variance is needed — invisible when both variances are equal, triggers when they differ substantially; (2) DIC uses number of groups as model complexity penalty instead of the effective parameter count from shrinkage — invisible when shrinkage is minimal (p_D ≈ k), triggers with strong shrinkage where p_D << k. The James-Stein (n-3) adjustment and t-distribution intervals are correct decoy patterns that compound the difficulty by requiring the solver to discriminate real bugs from valid conventions. Data is synthetic, shaped like multi-site clinical trials. A biostatistician fitting hierarchical models for clinical data would do this work."
solution_explanation = "Fix 1: In the fit_hierarchical_model call, replace the second sigma_w_sq argument with tau_sq so the shrinkage computation uses between-group variance. Fix 2: In the compute_dic call, replace data['n_groups'] with model_fit['effective_parameters'] so DIC uses the actual model complexity from shrinkage. Both fixes are single-argument replacements in pipeline.py; all other modules remain unchanged."
verification_explanation = "The verifier substitutes hidden observations (8 small groups n=5-8 with sigma²_w=1.0 and tau²≈7.3). It runs the fixed pipeline and compares output.json against expected values: shrinkage factors must be near 0.03-0.06 (not 0.17-0.33), shrunken means must reflect minimal shrinkage toward grand mean, DIC effective_params must be approximately 7.67 (not 8). Tests use rel_tol=1e-4 on shrinkage factors and means, rel_tol=1e-3 on DIC and intervals, ensuring both bugs are caught simultaneously."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 3600.0

