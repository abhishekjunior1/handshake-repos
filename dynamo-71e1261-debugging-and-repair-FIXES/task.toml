[task]
name = "dynamo/flaky-test-diagnosis"
description = "Debug a flaky test diagnosis pipeline with data-flow and rate-computation bugs causing incorrect failure classifications and distorted correlation analysis."

[metadata]
category = "Debugging and Repair"
subcategory = "Test Failure Repair"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["fix", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 5.0
difficulty_explanation = "The pipeline spans 7 modules (~1220 lines) implementing flaky test diagnosis without external libraries. Two data-flow bugs produce silently wrong output: (1) pipeline.py passes decay-weighted vectors to correlation_analyzer instead of unweighted binary vectors — correlation_analyzer then applies its own internal decay weighting, resulting in double-weighting that distorts Pearson correlation values. With decay_factor=1.0 on visible data, double-weighting is a no-op (1.0^n=1.0). With decay_factor=0.7 on hidden data, correlations are significantly distorted. (2) classifier.py averages the provided recent failure rate with cumulative history for a stabilized rate, justified by a comment about reducing transient spikes — on visible data where window_size equals total_runs both values are identical. Multiple correct-but-suspicious patterns in the code (harmonic mean confidence, bias corrections, sorting conventions) act as distractors. Data is synthetic CI/CD test history a DevOps reliability engineer would analyze."
solution_explanation = "Fix 1: In pipeline.py, change the correlation_analyzer.compute_correlations() call to pass binary_vectors instead of run_weighted_vectors — this eliminates the double decay-weighting (pipeline pre-weights, then correlation_analyzer weights again internally), producing correctly single-weighted correlations. Fix 2: In classifier.py, remove the stabilized_rate averaging that combines the provided recent rate with cumulative_failure_rate — use the provided rate directly for threshold comparison so recent failure spikes correctly trigger deterministic classification."
verification_explanation = "The verifier substitutes hidden execution history with 8 tests across 3 modules, 6 runs, decay_factor=0.7 and window_size=2. Bug 1 (double decay-weighting) distorts correlation values across all pairs in the correlation matrix — the correctly single-weighted correlations differ from double-weighted ones by 0.1-0.4 in absolute value. Bug 2 causes test_ch_receipt to be misclassified as flaky instead of deterministic_bug (stabilized rate 0.75 falls below 0.8 threshold while the correct recent rate 1.0 exceeds it). Tests check: classifications (exact category match), correlation_matrix (exact match — deterministic float arithmetic), timing_baselines (exact match), confidence scores (abs tolerance 0.01 for harmonic mean float noise), failure_rate/flip_rate metrics (abs tolerance 0.001), and overall_health percentages (abs tolerance 0.001). All tolerances are floating-point guards on deterministic arithmetic."

