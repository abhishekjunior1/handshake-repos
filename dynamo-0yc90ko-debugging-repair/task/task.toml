artifacts = ["/app/summary.json", "/app/process.py", "/app/config.py", "/app/parser.py", "/app/aggregator.py"]

[task]
name = "dynamo/event-processor"
description = "Find and fix three interacting bugs in a multi-file event processing pipeline that produces silently wrong aggregations on certain input patterns."

[metadata]
category = "debugging_and_repair"
subcategory = "test_failure_repair"
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
task_objective = ["fix", "debug"]
artifact_type = ["codebase"]
expert_time_estimate_hours = 4.0
difficulty_explanation = "This is the work of backend engineers debugging a data pipeline that silently produces wrong aggregations. Data is entirely synthetic (bespoke 4-module event processor with no public prior art). The pipeline runs cleanly on visible events and produces correct output — bugs are SILENT wrong-value defects triggered only by specific input patterns. Three bugs across three files: (1) config.py uses int(priority * impact) which truncates — should be round(). Visible events have integer products (3*2=6) so both give same result. Hidden events have fractional products (5*1.5=7.5) where int()=7, round()=8. (2) process.py sorts parsed events by timestamp before aggregation, but should sort by event_id for deterministic dedup ordering. Visible events have unique timestamps so sort order doesn't affect dedup. Hidden events have SAME timestamps with different event_ids — timestamp sort gives non-deterministic order affecting which duplicate gets kept. (3) aggregator.py deduplicates by timestamp within a bucket, but should dedup by event_id. Visible events all have unique timestamps, so timestamp-dedup and id-dedup behave identically. Hidden events have multiple events at the SAME timestamp (different event_ids) that should all be counted but get wrongly deduped. COMPOUND: hidden events h001 and h002 share a timestamp AND have fractional impacts, triggering bugs 1+3 simultaneously on the same bucket."
solution_explanation = "Three targeted fixes: (1) config.py: change int(priority * impact) to round(priority * impact). (2) process.py: change sort key from timestamp to event_id. (3) aggregator.py: change dedup_key from ev['timestamp'] to ev['event_id']. Each fix is one line. Parser.py is correct and must not be modified."
verification_explanation = "The verifier injects hidden_events.json (10 events with fractional impacts, duplicate timestamps, different event_ids) and runs process.py. Checks exact match on count, total_score, max_score for all categories and windows. The buggy pipeline deduplicates events that share a timestamp (losing h002, h004, h006, h007, h009, h010), AND truncates fractional scores — producing fewer events and lower totals than expected."

