name = "dynamo/polynomial-gcd"
description = "Modular polynomial GCD computation pipeline with Chinese Remainder reconstruction over integer coefficient rings."

[metadata]
category = "Mathematics and Formal Reasoning"
subcategory = "Symbolic computation"
