artifacts = ["/app/output.json"]

[task]
name = "dynamo/dma-scatter-gather"
description = "Debug a DMA transfer controller with scatter-gather engine that has bugs in burst calculation, descriptor chain traversal, and channel preemption logic."

[metadata]
category = "Hardware Embedded and Low Level Systems"
subcategory = "Low-level runtime and performance"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["fix", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 5.0
difficulty_explanation = "The pipeline spans 7 modules (~960 lines) implementing a DMA scatter-gather controller without external libraries. Three bugs are spread across three different files (pipeline.py, scatter_gather.py, channel_arbiter.py), each justified by a plausible engineering comment. Bug 1 hardcodes a burst size that happens to be optimal for the visible configuration's aligned addresses but violates AXI4 alignment constraints for unaligned transfers. Bug 2 uses the descriptor metadata header size instead of the payload data size for transfer count calculation — invisible when both are equal (single-descriptor transfer). Bug 3 inverts the preemption priority comparison direction — invisible with a single channel where no preemption occurs. The visible configuration masks all three bugs through address alignment, equal descriptor/payload sizes, and single-channel operation. A hardware systems engineer familiar with DMA controller design and AXI bus protocols would work through this. Data is synthetic, modeled on real AXI4-Stream DMA transfer configurations."
solution_explanation = "The solver patches three files: (1) pipeline.py — replaces hardcoded burst_size=16 with compute_optimal_burst(src_addr, transfer_size, max_burst) which respects address alignment; (2) scatter_gather.py — changes seg_size // descriptor_size to seg_size // payload_size for computing the number of data transfers per segment; (3) channel_arbiter.py — changes candidate_pri > current_pri to candidate_pri < current_pri for correct preemption (lower numeric value = higher priority per AXI convention). Each fix is a single line change requiring understanding of the AXI4 burst protocol, scatter-gather descriptor semantics, and priority arbitration conventions."
verification_explanation = "The verifier substitutes two structurally different hidden configurations and runs the fixed pipeline on each. Hidden config 1 has 3 channels with unaligned addresses (requiring burst=4), chained descriptors (payload_size=4096 vs descriptor_size=64), and multi-channel preemption. Hidden config 2 has 2 channels with different alignment (burst=8), 5 descriptors (payload_size=8192 vs descriptor_size=32), and reversed priority ordering. Tests compare exact JSON output against pre-computed expected values. The buggy pipeline produces 64 cycles with 64 preemptions vs the correct 3 cycles with 0 preemptions on hidden config 1 — the gap is large enough to reject any partially-fixed implementation while the deterministic integer arithmetic ensures exact reproducibility."

[verifier]
timeout_sec = 120.0

