artifacts = ["/app/output.json"]

[task]
name = "dynamo/historian-migration"
description = "Debug PLC data historian migration pipeline with gap detection and interpolation bugs."

[metadata]
category = "software_engineering"
subcategory = "porting_and_migration"
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
task_objective = ["fix", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 5.0
difficulty_explanation = "The pipeline spans 6 modules (~800 lines) implementing a PLC data historian binary archive migration to JSON time-series. Two bugs in the orchestrator cause failures on manifests with discrete tags and fast-scanning tags: (1) gap interpolation uses linear mode for all tags including discrete/boolean signals that require zero-order hold, and (2) gap detection uses a fixed 5-second threshold regardless of each tag's configured scan rate, missing short gaps in fast-scanning tags. Both bugs are invisible on the visible manifest which contains only analog tags with gaps exceeding the default threshold. The codebase also contains correct-but-suspicious patterns (reverse-chronological quality propagation, non-monotonic timestamp acceptance) that punish over-fixing. A SCADA/DCS migration engineer upgrading from legacy historian systems (Honeywell TDC3000, Yokogawa CENTUM) to modern platforms (OSIsoft PI, InfluxDB) would do this work. Data is synthetic, structured like real historian archives."
solution_explanation = "Fix 1: Replace the hardcoded detect_gaps(samples) call with detect_gaps(samples, gap_threshold_us=scan_rate_us*3) using the tag's configured scan_rate_us field (falling back to the default when unconfigured). Fix 2: Replace the hardcoded interpolation_mode='linear' in fill_gaps with conditional logic that uses 'stepped' for discrete tags and 'linear' for analog tags. Both fixes are in pipeline.py's process_tag function. The reverse-chronological quality propagation and non-monotonic timestamp handling must NOT be changed — they are correct historian-specific behaviors."
verification_explanation = "Hidden manifest contains: a discrete tag (type='discrete') with an 8-second gap triggering Bug 1 (linear interpolation produces 0.5 for the midpoint instead of correct stepped value 1.0), an analog tag with scan_rate_us=500000 and a 3-second gap triggering Bug 2 (gap is missed because 3s < 5s default threshold, but should be detected since 3s > 1.5s = 3×500ms), and a third tag with non-monotonic timestamps and multi-sample quality batch exercising both decoys. Expected output requires both bugs fixed simultaneously — partial fixes still fail because sample counts and interpolated values will be wrong."

